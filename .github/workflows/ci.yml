name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: brain/go.mod
          cache-dependency-path: brain/go.mod
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Plugin, marketplace and PowerShell scripts
        shell: powershell
        run: .\check-plugin.ps1

      - name: Brain
        working-directory: brain
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt: $unformatted"; exit 1; fi
          go vet ./...
          go test ./...

      - name: Scene
        working-directory: scene
        shell: pwsh
        run: |
          dotnet build -c Release --locked-mode -nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet run -c Release --no-build -- --selftest
