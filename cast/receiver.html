<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Delta</title>
<!-- The Chromecast's page, served by the gateway on its guests' entrance at /cast/receiver: the Cast application ID the
     user registers points here. Its CSP allows www.gstatic.com for the framework below, on this page only. -->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #state {
    position: fixed; left: 0; right: 0; bottom: 8%; margin: 0 auto; max-width: 70%;
    padding: 0.6em 1em; border-radius: 0.4em; text-align: center;
    font: 500 32px/1.3 system-ui, sans-serif; color: #f2f2f2; background: rgba(0, 0, 0, 0.6);
  }
</style>
</head>
<body>
<!-- muted is false: the television plays Delta's voice; the receiver needs no gesture to play sound. -->
<video id="scene" autoplay playsinline></video>
<p id="state"></p>
<script src="receiver.js"></script>
</body>
</html>
